<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="Arquitetura da aplicacao">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="560" fill="url(#bg)" rx="16"/>
  <text x="480" y="38" fill="#e2e8f0" font-size="22" font-weight="700" text-anchor="middle">Assistente Jurídico — RAG cache-first + MongoDB Atlas</text>

  <!-- UI -->
  <rect x="40" y="70" width="220" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="150" y="98" fill="#38bdf8" font-size="15" font-weight="700" text-anchor="middle">UI · Next.js / React</text>
  <text x="150" y="122" fill="#cbd5e1" font-size="12" text-anchor="middle">ChatView · SearchView</text>
  <text x="150" y="140" fill="#cbd5e1" font-size="12" text-anchor="middle">RelatorView · RelationshipGraph</text>
  <text x="150" y="162" fill="#94a3b8" font-size="11" text-anchor="middle">chat · busca · grafo</text>

  <!-- API -->
  <rect x="40" y="210" width="220" height="110" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="150" y="238" fill="#a78bfa" font-size="15" font-weight="700" text-anchor="middle">API Routes</text>
  <text x="150" y="262" fill="#cbd5e1" font-size="12" text-anchor="middle">/api/chat · /api/search</text>
  <text x="150" y="280" fill="#cbd5e1" font-size="12" text-anchor="middle">/api/drilldown · /api/relatores</text>
  <text x="150" y="300" fill="#cbd5e1" font-size="12" text-anchor="middle">/api/memory · /api/cache · /api/auth</text>

  <!-- Pipeline -->
  <rect x="330" y="120" width="270" height="150" rx="12" fill="#0b3b2e" stroke="#34d399" stroke-width="1.8"/>
  <text x="465" y="148" fill="#34d399" font-size="15" font-weight="700" text-anchor="middle">Motor de Perguntas · pipeline.ts</text>
  <text x="465" y="174" fill="#d1fae5" font-size="12" text-anchor="middle">1 · cache-vector (similaridade)</text>
  <text x="465" y="194" fill="#d1fae5" font-size="12" text-anchor="middle">2 · roteamento (fastRoute / LLM)</text>
  <text x="465" y="214" fill="#d1fae5" font-size="12" text-anchor="middle">3 · cache-signature</text>
  <text x="465" y="234" fill="#d1fae5" font-size="12" text-anchor="middle">4 · execução por intenção</text>
  <text x="465" y="256" fill="#6ee7b7" font-size="11" text-anchor="middle">count · graph · semantic</text>

  <!-- LLM -->
  <rect x="330" y="300" width="270" height="90" rx="12" fill="#3b0b2e" stroke="#f472b6" stroke-width="1.5"/>
  <text x="465" y="328" fill="#f472b6" font-size="15" font-weight="700" text-anchor="middle">LLM · llm.ts</text>
  <text x="465" y="352" fill="#fbcfe8" font-size="12" text-anchor="middle">roteia intenção (JSON) · sintetiza</text>
  <text x="465" y="372" fill="#fbcfe8" font-size="12" text-anchor="middle">extrai fatos de memória</text>

  <!-- MongoDB Atlas -->
  <rect x="680" y="90" width="240" height="330" rx="12" fill="#052e2b" stroke="#22d3ee" stroke-width="1.8"/>
  <text x="800" y="118" fill="#22d3ee" font-size="15" font-weight="700" text-anchor="middle">MongoDB Atlas</text>
  <rect x="700" y="134" width="200" height="52" rx="8" fill="#0e3a44"/>
  <text x="800" y="154" fill="#e0f2fe" font-size="12" text-anchor="middle" font-weight="600">Vector Search</text>
  <text x="800" y="172" fill="#a5f3fc" font-size="11" text-anchor="middle">$vectorSearch · $rankFusion</text>
  <rect x="700" y="196" width="200" height="52" rx="8" fill="#0e3a44"/>
  <text x="800" y="216" fill="#e0f2fe" font-size="12" text-anchor="middle" font-weight="600">Atlas Search</text>
  <text x="800" y="234" fill="#a5f3fc" font-size="11" text-anchor="middle">$search · $searchMeta</text>
  <rect x="700" y="258" width="200" height="52" rx="8" fill="#0e3a44"/>
  <text x="800" y="278" fill="#e0f2fe" font-size="12" text-anchor="middle" font-weight="600">GraphRAG</text>
  <text x="800" y="296" fill="#a5f3fc" font-size="11" text-anchor="middle">$graphLookup</text>
  <rect x="700" y="320" width="200" height="52" rx="8" fill="#0e3a44"/>
  <text x="800" y="340" fill="#e0f2fe" font-size="12" text-anchor="middle" font-weight="600">Cache semântico + Memória</text>
  <text x="800" y="358" fill="#a5f3fc" font-size="11" text-anchor="middle">chat_cache · agent_memory</text>

  <!-- flows -->
  <line x1="150" y1="180" x2="150" y2="208" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="260" y1="250" x2="328" y2="200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="465" y1="270" x2="465" y2="298" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="190" x2="678" y2="190" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="345" x2="678" y2="345" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="480" y="452" fill="#64748b" font-size="12" text-anchor="middle">Memória lida em paralelo (Promise.all) no início · persistência de turnos e fatos em background</text>
  <text x="480" y="474" fill="#64748b" font-size="12" text-anchor="middle">Caminho mais barato primeiro: cache → roteamento → execução → LLM só quando necessário</text>
</svg>
